<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>ChatsApp</title>
<style>
  :root { --green: #008069; --acc: #00a884; --text: #111b21; --sub: #667781; --line: #e9edef; --bg: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --text: #e9edef; --sub: #8696a0; --line: #222d34; --bg: #111b21; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 280px; font: 14px/1.4 "Segoe UI", Arial, sans-serif; color: var(--text); background: var(--bg); }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--green); color: #fff; }
  header img { width: 32px; height: 32px; }
  header b { font-size: 17px; }
  header span { margin-inline-start: auto; font-size: 12px; opacity: .85; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .row small { display: block; color: var(--sub); font-size: 12px; }
  /* מתג כמו בוואטסאפ */
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch i { position: absolute; inset: 0; border-radius: 11px; background: #c4c9cc; cursor: pointer; transition: background .15s; }
  .switch i::after { content: ""; position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + i { background: var(--acc); }
  .switch input:checked + i::after { transform: translateX(-16px); }
  .switch input:focus-visible + i { outline: 2px solid var(--acc); outline-offset: 2px; }
  /* גרסה חדשה זמינה */
  .update { display: none; align-items: center; gap: 10px; padding: 10px 16px; background: #d9fdd3; color: #111b21; text-decoration: none; border-bottom: 1px solid var(--line); }
  .update.show { display: flex; }
  .update b { display: block; }
  .update small { color: #008069; }
  .update::before { content: "⬇"; flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--acc); color: #fff; display: grid; place-items: center; }
  footer { padding: 14px 16px; text-align: center; color: var(--sub); font-size: 13px; }
  .links { display: flex; justify-content: center; gap: 14px; margin-top: 10px; }
  .links a { display: inline-flex; width: 34px; height: 34px; align-items: center; justify-content: center; border-radius: 50%; color: var(--text); background: var(--line); }
  .links a:hover { background: var(--acc); color: #fff; }
  .links svg { width: 20px; height: 20px; fill: currentColor; }
  .links img { width: 22px; height: 22px; border-radius: 4px; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <b>ChatsApp</b>
    <span id="ver"></span>
  </header>
  <a class="update" id="update" target="_blank" rel="noopener" href="https://github.com/TOP-SHEBAMITMACHIM/chatsapp/releases/latest">
    <div><b id="update-title">יצאה גרסה חדשה</b><small>לחצו להורדה</small></div>
  </a>
  <label class="row" for="dark">
    <div>מצב כהה<small>בחלון השיחה בגוגל צ'אט וב-Gmail</small></div>
    <span class="switch"><input type="checkbox" id="dark"><i></i></span>
  </label>
  <footer>
    התוסף נוצר ע״י טופ שבמתמחים
